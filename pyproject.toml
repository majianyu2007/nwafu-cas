[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nwafu-cas"
dynamic = ["version"]
description = "西北农林科技大学统一身份认证（authserver.nwafu.edu.cn）Python 客户端：账号/扫码/FIDO 登录与全部二次认证方式"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "majianyu2007" }]
requires-python = ">=3.10"
keywords = ["nwafu", "西北农林科技大学", "cas", "authserver", "统一身份认证", "sso", "2fa", "totp", "wisedu"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pycryptodome>=3.20",
    "pyotp>=2.9",
]

[project.optional-dependencies]
fido2 = ["cryptography>=42"]
qr = ["segno>=1.6"]
dev = ["pytest>=8", "cryptography>=42", "ruff>=0.6"]

[project.scripts]
nwafu-cas = "nwafu_cas.cli:main"

[project.urls]
Homepage = "https://github.com/majianyu2007/nwafu-cas"
Issues = "https://github.com/majianyu2007/nwafu-cas/issues"
Changelog = "https://github.com/majianyu2007/nwafu-cas/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/nwafu_cas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nwafu_cas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]
